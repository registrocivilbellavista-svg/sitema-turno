<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE DEFUNCIONES - Registro Civil Bella Vista</title>
    <!-- Enlace a la biblioteca de iconos Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e222b; /* Fondo oscuro institucional */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            box-sizing: border-box;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        p {
            color: #a0aec0;
            margin: 0;
            font-size: 1.1rem;
        }

        /* Buscador Inteligente */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            font-size: 1.3rem;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 55px;
            background-color: #2a2f3b;
            border: 2px solid #323946;
            border-radius: 50px;
            color: #ffffff;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-input:focus {
            border-color: #4a5568;
            background-color: #2d3342;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Tabla de Actas */
        .table-container {
            width: 100%;
            max-width: 950px;
            background-color: #222630;
            border: 1px solid #323946;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            min-height: 150px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #2a2f3b;
            color: #a0aec0;
            padding: 16px 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #323946;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid #2d3342;
            font-size: 1rem;
        }

        tr:hover td {
            background-color: #282e3a;
        }

        .col-fecha {
            color: #cbd5e0;
            font-size: 0.9rem;
        }

        /* Etiquetas de las Empresas */
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-bouchard { background-color: rgba(82, 133, 197, 0.15); color: #5285c5; border: 1px solid rgba(82, 133, 197, 0.3); }
        .badge-cossani { background-color: rgba(66, 184, 115, 0.15); color: #42b873; border: 1px solid rgba(66, 184, 115, 0.3); }
        .badge-previsora { background-color: rgba(168, 82, 156, 0.15); color: #a8529c; border: 1px solid rgba(168, 82, 156, 0.3); }

        /* Botón Ver Acta */
        .btn-open {
            color: #718096;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #2a2f3b;
            border: 1px solid #323946;
            transition: all 0.2s ease;
        }

        .btn-open:hover {
            background-color: #ffffff;
            color: #1e222b;
            transform: scale(1.05);
        }

        /* Estados de Carga y Mensajes */
        .loading {
            padding: 40px;
            text-align: center;
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .no-results {
            display: none;
            padding: 40px;
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>SISTEMA DE DEFUNCIONES</h1>
        <p>Registro Civil Bella Vista - Sincronización Automática con Google Drive</p>
    </div>

    <!-- Buscador en tiempo real -->
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="inputBuscar" class="search-input" placeholder="Buscar fallecido por nombre o apellido..." onkeyup="filtrarActas()" disabled>
    </div>
    <!-- Contenedor de la Tabla -->
    <div class="table-container">
        <div id="loadingState" class="loading">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 15px; display: block; color: #5285c5;"></i>
            Conectando con Google Drive y cargando actas vigentes...
        </div>

        <table id="tablaActas" style="display: none;">
            <thead>
                <tr>
                    <th>Fallecido (Nombre Completo)</th>
                    <th>Empresa Cobertura</th>
                    <th>Última Actualización</th>
                    <th style="text-align: center; width: 80px;">Ver Acta</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <!-- Los renglones ordenados por fecha se generan automáticamente -->
            </tbody>
        </table>

        <div class="no-results" id="sinResultados">
            <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; margin-bottom: 10px; display: block;"></i>
            No se encontraron actas que coincidan con el criterio ingresado.
        </div>
    </div>

    <script>
        // URL DE TU GOOGLE APPS SCRIPT (REEMPLAZÁ ESTA URL POR LA TUYA)
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbx1PgdBYUFe0nfN3wE43nibAtTFhi3mBTPDo8GB6W8VXarRnXa-RAOV6uEXtwQWcVO-0w/exec";
        
        let todasLasActas = [];

        // Función para consultar a Google Drive de forma automática al abrir la página
        async function cargarActasDesdeDrive() {
            try {
                const respuesta = await fetch(URL_SCRIPT);
                todasLasActas = await respuesta.json();
                
                const cuerpoTabla = document.getElementById("cuerpoTabla");
                cuerpoTabla.innerHTML = ""; // Limpiar spinner de carga
                
                if(todasLasActas.length === 0) {
                    document.getElementById("loadingState").innerHTML = "No se encontraron archivos en las carpetas vinculadas.";
                    return;
                }

                // Generar dinámicamente cada fila (Vienen ordenadas por fecha más reciente desde Drive)
                todasLasActas.forEach(acta => {
                    const fila = document.createElement("tr");
                    fila.className = "acta-row";
                    
                    fila.innerHTML = `
                        <td>${acta.nombre}</td>
                        <td><span class="badge badge-${acta.empresa}">${acta.empresa}</span></td>
                        <td class="col-fecha">${acta.fechaTexto}</td>
                        <td style="text-align: center;">
                            <a href="${acta.link}" target="_self" class="btn-open">
                                <i class="fa-solid fa-file-pdf"></i>
                            </a>
                        </td>
                    `;
                    cuerpoTabla.appendChild(fila);
                });

                // Activar componentes visuales ocultos
                document.getElementById("loadingState").style.display = "none";
                document.getElementById("tablaActas").style.display = "table";
                document.getElementById("inputBuscar").disabled = false;
                document.getElementById("inputBuscar").placeholder = "Escribí para buscar entre las " + todasLasActas.length + " actas detectadas...";

            } catch (error) {
                console.error("Error cargando actas:", error);
                document.getElementById("loadingState").innerHTML = "<i class='fa-solid fa-triangle-exclamation' style='color:#e53e3e; font-size:2rem; margin-bottom:10px; display:block;'></i> Error de conexión con el servidor de datos.";
            }
        }

        // Buscador interno instantáneo
        function filtrarActas() {
            const filter = document.getElementById("inputBuscar").value.toUpperCase();
            const rows = document.getElementsByClassName("acta-row");
            const sinResultados = document.getElementById("sinResultados");
            const tabla = document.getElementById("tablaActas");
            let encontrados = 0;

            for (let i = 0; i < rows.length; i++) {
                const textoFila = rows[i].textContent || rows[i].innerText;
                if (textoFila.toUpperCase().indexOf(filter) > -1) {
                    rows[i].style.display = "";
                    encontrados++;
                } else {
                    rows[i].style.display = "none";
                }
            }

            if (encontrados === 0 && filter !== "") {
                tabla.style.display = "none";
                sinResultados.style.display = "block";
            } else {
                tabla.style.display = "table";
                sinResultados.style.display = "none";
            }
        }

        // Iniciar carga automática al abrir la web
        window.onload = cargarActasDesdeDrive;
    </script>

</body>
</html>
