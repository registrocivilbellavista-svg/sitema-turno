<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos Compartidos LAN</title>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; background-color: #f4f6f9;">

    <header style="text-align: center; margin-bottom: 30px;">
        <h1>📅 Turnos en Red Local (Multi-PC)</h1>
        <p>Los datos se guardan centralizados en el servidor de la oficina</p>
    </header>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
        <!-- Formulario -->
        <section style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h3>Agendar Turno</h3>
            <form id="form-turno" onsubmit="guardarTurno(event)">
                <input type="text" id="paciente" required placeholder="Nombre del Paciente" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;"><br>
                <input type="date" id="fecha" required style="width:48%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                <input type="time" id="hora" required style="width:48%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; float:right;"><br>
                <button type="submit" style="width:100%; background:#2ecc71; color:white; border:none; padding:12px; font-weight:bold; cursor:pointer; border-radius:4px;">Reservar Turno</button>
            </form>
        </section>

        <!-- Lista -->
        <section style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h3>Turnos Agendados en la Oficina</h3>
            <div id="lista-turnos">Cargando turnos...</div>
        </section>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function cargarTurnos() {
            try {
                const res = await fetch(`${API_URL}/api/turnos`);
                const turnos = await res.json();
                const contenedor = document.getElementById('lista-turnos');
                contenedor.innerHTML = '';
                
                if(!turnos || turnos.length === 0) {
                    contenedor.innerHTML = '<p style="color:#7f8c8d;">No hay turnos registrados todavía.</p>';
                    return;
                }

                turnos.forEach(t => {
                    const div = document.createElement('div');
                    div.style.cssText = "background:#fcfcfc; padding:12px; margin-bottom:10px; border-radius:4px; border:1px solid #eee; border-left:5px solid #3498db; position: relative;";
                    div.innerHTML = `
                        <strong>${t.paciente}</strong><br>
                        <span style="color:#e67e22; font-size:14px;">📅 ${t.fecha} a las ${t.hora} hs</span>
                        <button onclick="eliminarTurno(${t.id})" style="position: absolute; right: 10px; top: 12px; background: #e74c3c; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">
                            Cancelar
                        </button>
                    `;
                    contenedor.appendChild(div);
                });
            } catch (e) {
                document.getElementById('lista-turnos').innerHTML = '❌ Error al conectar con el servidor central.';
            }
        }

        async function guardarTurno(e) {
            e.preventDefault();
            const turno = {
                paciente: document.getElementById('paciente').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value
            };

            await fetch(`${API_URL}/api/turnos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(turno)
            });
            document.getElementById('form-turno').reset();
            cargarTurnos();
        }

        // Nueva función para borrar el turno en el servidor central
        async function eliminarTurno(id) {
            if (confirm("¿Estás seguro de que querés cancelar este turno en el sistema compartido?")) {
                try {
                    await fetch(`${API_URL}/api/turnos/${id}`, {
                        method: 'DELETE'
                    });
                    cargarTurnos(); // Recargar la lista inmediatamente
                } catch (err) {
                    alert("Error al intentar eliminar el turno.");
                }
            }
        }

        // Consultar cada 3 segundos para que los borrados impacten rápido en la otra PC
        setInterval(cargarTurnos, 3000);
        cargarTurnos();
    </script>
</body>
</html>
